# ============================================================================
# Kustomize Base Configuration
# ============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mae

resources:
  - configmap.yaml
  - secret.yaml
  - rbac.yaml
  - redis.yaml
  - chromadb.yaml
  - mae-api.yaml
  - ingress.yaml

commonLabels:
  app.kubernetes.io/name: mae
  app.kubernetes.io/part-of: mae-platform

images:
  - name: mae-api
    newName: mae-api
    newTag: latest
