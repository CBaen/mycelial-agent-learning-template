# ============================================================================
# MAE Secret
# ============================================================================
# Sensitive configuration data (base64 encoded)
#
# NOTE: This is a template. In production, use Sealed Secrets, External Secrets,
# or HashiCorp Vault for secure secret management.
#
# To create secrets:
#   echo -n 'your-secret-key' | base64
#
# To apply:
#   kubectl create secret generic mae-secrets \
#     --from-literal=SECRET_KEY=your-actual-secret-key \
#     --namespace mae
#
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: mae-secrets
  namespace: mae
  labels:
    app: mae
type: Opaque
data:
  # CHANGE THIS IN PRODUCTION!
  # Generate with: python -c "import secrets; print(secrets.token_hex(32))"
  # Then base64 encode: echo -n 'your-key' | base64
  SECRET_KEY: Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tcGxlYXNlLXVzZS1zdHJvbmctcmFuZG9tLWtleQ==

  # Optional: Redis password (if using authentication)
  # REDIS_PASSWORD: ""

  # Optional: Database credentials (if using SQL database)
  # DATABASE_URL: ""
