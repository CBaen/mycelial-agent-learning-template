# ============================================================================
# MAE REST API - FastAPI Service
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mae-api
  namespace: mae
  labels:
    app: mae-api
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mae-api
  template:
    metadata:
      labels:
        app: mae-api
        component: api
    spec:
      serviceAccountName: mae-service-account
      containers:
        - name: mae-api
          image: mae-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            # Load configuration from ConfigMap
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: mae-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: mae-config
                  key: REDIS_PORT
            - name: REDIS_DB
              valueFrom:
                configMapKeyRef:
                  name: mae-config
                  key: REDIS_DB
            - name: CHROMADB_HOST
              valueFrom:
                configMapKeyRef:
                  name: mae-config
                  key: CHROMADB_HOST
            - name: CHROMADB_PORT
              valueFrom:
                configMapKeyRef:
                  name: mae-config
                  key: CHROMADB_PORT
            - name: API_HOST
              valueFrom:
                configMapKeyRef:
                  name: mae-config
                  key: API_HOST
            - name: API_PORT
              valueFrom:
                configMapKeyRef:
                  name: mae-config
                  key: API_PORT
            - name: API_WORKERS
              valueFrom:
                configMapKeyRef:
                  name: mae-config
                  key: API_WORKERS
            - name: JWT_ALGORITHM
              valueFrom:
                configMapKeyRef:
                  name: mae-config
                  key: JWT_ALGORITHM
            - name: ACCESS_TOKEN_EXPIRE_MINUTES
              valueFrom:
                configMapKeyRef:
                  name: mae-config
                  key: ACCESS_TOKEN_EXPIRE_MINUTES
            - name: PROMETHEUS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: mae-config
                  key: PROMETHEUS_ENABLED
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: mae-config
                  key: LOG_LEVEL
            # Load secrets
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mae-secrets
                  key: SECRET_KEY
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /system/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /system/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mae-api-service
  namespace: mae
  labels:
    app: mae-api
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: mae-api
---
# ============================================================================
# Horizontal Pod Autoscaler
# ============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mae-api-hpa
  namespace: mae
  labels:
    app: mae-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mae-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max
