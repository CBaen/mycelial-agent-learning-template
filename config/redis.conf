# ============================================================================
# Redis Configuration for MAE System
# ============================================================================
#
# This is a production-ready Redis configuration optimized for the
# Mycelial Agent Engine's workload patterns.
#
# ============================================================================

# ==========================================================================
# Network Configuration
# ==========================================================================
bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# ==========================================================================
# General Configuration
# ==========================================================================
daemonize no
pidfile /var/run/redis_6379.pid
loglevel notice
logfile ""
databases 16

# ==========================================================================
# Persistence Configuration
# ==========================================================================

# RDB (Redis Database) - Point-in-time snapshots
save 900 1      # Save after 900 seconds if at least 1 key changed
save 300 10     # Save after 300 seconds if at least 10 keys changed
save 60 10000   # Save after 60 seconds if at least 10000 keys changed

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# AOF (Append-Only File) - Durability log
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# ==========================================================================
# Memory Management
# ==========================================================================
maxmemory 512mb
maxmemory-policy allkeys-lru  # Evict least recently used keys when max memory reached

# ==========================================================================
# Lazy Freeing (Asynchronous Deletion)
# ==========================================================================
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# ==========================================================================
# Streams Configuration (Critical for MAE)
# ==========================================================================
# Streams are used heavily for data ingestion
stream-node-max-bytes 4096
stream-node-max-entries 100

# ==========================================================================
# Pub/Sub Configuration
# ==========================================================================
# Used for agent communication
notify-keyspace-events ""

# ==========================================================================
# Advanced Configuration
# ==========================================================================
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000

# ==========================================================================
# Active Rehashing
# ==========================================================================
activerehashing yes

# ==========================================================================
# Client Configuration
# ==========================================================================
maxclients 10000

# ==========================================================================
# Slow Log Configuration
# ==========================================================================
slowlog-log-slower-than 10000
slowlog-max-len 128

# ==========================================================================
# Latency Monitoring
# ==========================================================================
latency-monitor-threshold 0

# ==========================================================================
# Event Notification
# ==========================================================================
# Disabled by default for performance
# Enable if you need keyspace notifications
# notify-keyspace-events Ex

# ==========================================================================
# Security
# ==========================================================================
# Uncomment and set a strong password for production
# requirepass YOUR_STRONG_PASSWORD_HERE

# Disable dangerous commands (optional, for production)
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command CONFIG ""

# ==========================================================================
# Replication (Optional - for high availability)
# ==========================================================================
# Uncomment if setting up Redis replication
# replicaof <masterip> <masterport>
# masterauth <master-password>
# replica-serve-stale-data yes
# replica-read-only yes

# ==========================================================================
# Cluster Configuration (Optional - for horizontal scaling)
# ==========================================================================
# Uncomment if setting up Redis Cluster
# cluster-enabled yes
# cluster-config-file nodes-6379.conf
# cluster-node-timeout 15000

# ==========================================================================
# Performance Tuning
# ==========================================================================
# Increase performance for high-throughput scenarios
hz 10
dynamic-hz yes
