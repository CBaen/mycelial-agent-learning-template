version: '3.8'

# ============================================================================
# Mycelial Agent Engine (MAE) - Docker Compose Configuration
# ============================================================================
#
# This file defines the full MAE stack with all required services:
# - Redis: Message broker and data backbone
# - ChromaDB: Vector database for policy embeddings
# - MAE Application: The agent system itself
#
# Usage:
#   docker-compose up -d          # Start all services
#   docker-compose down           # Stop all services
#   docker-compose logs -f mae    # View MAE logs
#   docker-compose ps             # Check service status
#
# ============================================================================

services:
  # ==========================================================================
  # Redis - Message Broker and Data Backbone
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: mae_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - mae_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ==========================================================================
  # ChromaDB - Vector Database for Collective Memory
  # ==========================================================================
  chromadb:
    image: chromadb/chroma:latest
    container_name: mae_chromadb
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000
      - ANONYMIZED_TELEMETRY=False
      - ALLOW_RESET=True
      - IS_PERSISTENT=True
    networks:
      - mae_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # ==========================================================================
  # MAE Application - Agent System
  # ==========================================================================
  mae:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mae_app
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./logs:/app/logs
      - ./simulation_results:/app/simulation_results
    environment:
      # Redis connection
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0

      # Vector DB connection
      - VECTOR_DB_BACKEND=chromadb
      - VECTOR_DB_HOST=chromadb
      - VECTOR_DB_PORT=8000

      # Application settings
      - MAE_CONFIG_PATH=/app/config/config.yaml
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
    networks:
      - mae_network
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'
    # Choose which mode to run (uncomment one):
    command: python run_simulation.py
    # command: python run_live.py

  # ==========================================================================
  # MAE REST API - FastAPI Service
  # ==========================================================================
  mae-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: mae_api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./src:/app/src:ro
      - ./logs:/app/logs
    environment:
      # API Configuration
      - API_HOST=0.0.0.0
      - API_PORT=8080
      - API_WORKERS=4

      # Security
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production-please}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30

      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0

      # ChromaDB
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000

      # Observability
      - PROMETHEUS_ENABLED=true
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
    networks:
      - mae_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/system/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # ==========================================================================
  # Optional: Redis Commander - Web UI for Redis
  # ==========================================================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: mae_redis_ui
    restart: unless-stopped
    profiles:
      - debug
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    networks:
      - mae_network
    depends_on:
      - redis

  # ==========================================================================
  # Prometheus - Metrics Collection (Optional)
  # ==========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: mae_prometheus
    restart: unless-stopped
    profiles:
      - monitoring
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - mae_network

  # ==========================================================================
  # Grafana - Dashboards (Optional)
  # ==========================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: mae_grafana
    restart: unless-stopped
    profiles:
      - monitoring
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - mae_network
    depends_on:
      - prometheus

  # ==========================================================================
  # Jaeger - Distributed Tracing (Optional)
  # ==========================================================================
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: mae_jaeger
    restart: unless-stopped
    profiles:
      - monitoring
    ports:
      - "16686:16686"  # UI
      - "14268:14268"  # Collector HTTP
      - "6831:6831/udp"  # Agent
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    networks:
      - mae_network

  # ==========================================================================
  # Optional: Data Producer (Example)
  # ==========================================================================
  # Uncomment and customize for your domain
  # data-producer:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.producer
  #   container_name: mae_data_producer
  #   restart: unless-stopped
  #   depends_on:
  #     - redis
  #   environment:
  #     - REDIS_HOST=redis
  #     - REDIS_PORT=6379
  #     - DATA_SOURCE_API_KEY=${DATA_SOURCE_API_KEY}
  #   networks:
  #     - mae_network
  #   command: python src/connectors/your_producer.py

# ============================================================================
# Networks
# ============================================================================
networks:
  mae_network:
    driver: bridge
    name: mae_network

# ============================================================================
# Volumes
# ============================================================================
volumes:
  redis_data:
    name: mae_redis_data
    driver: local

  chromadb_data:
    name: mae_chromadb_data
    driver: local

  prometheus_data:
    name: mae_prometheus_data
    driver: local

  grafana_data:
    name: mae_grafana_data
    driver: local
