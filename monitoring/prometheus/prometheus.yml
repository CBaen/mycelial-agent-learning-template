global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    cluster: 'mae-production'
    environment: 'prod'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load alert rules
rule_files:
  - '/etc/prometheus/alert_rules.yml'

# Scrape configurations
scrape_configs:
  # MAE Application metrics
  - job_name: 'mae-app'
    scrape_interval: 5s
    static_configs:
      - targets: ['mae-app:8000']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'mae-app-1'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node exporter for system metrics
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  # Grafana metrics
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
